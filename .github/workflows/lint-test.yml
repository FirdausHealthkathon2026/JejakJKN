name: Lint & Unit Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: 'apps/*/package-lock.json'}
      - run: make install
      - run: make lint test-contract test-unit
      - run: npm ci && npm run build
        working-directory: apps/patient-web
      - run: npm ci && npm run build
        working-directory: apps/simrs-a-web
