openapi: 3.1.0
info: {title: JejakJKN Claim Verification & Rules Service API, version: 1.0.0}
x-implementation-status: implemented-gate-4-5
servers: [{url: http://localhost:18080}]
security: [{bearerAuth: []}]
paths:
  /api/v1/verifications:
    post:
      operationId: requestClaimVerification
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VerificationRequest'}}}}
      responses:
        '202': {description: Verification queued, content: {application/json: {schema: {$ref: '#/components/schemas/QueuedVerification'}}}}
  /api/v1/verifications/history:
    get:
      operationId: getClaimVerificationHistory
      parameters:
        - {name: claim_source, in: query, required: true, schema: {type: string}}
        - {name: claim_id, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Immutable run history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assessment'}}}}}
  /api/v1/verifications/{verification_id}:
    get:
      operationId: getVerificationAssessment
      parameters: [{$ref: '#/components/parameters/VerificationId'}]
      responses:
        '200': {description: Four-dimensional assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
  /api/v1/verifications/{verification_id}/candidates:
    get:
      operationId: getVerificationCandidates
      parameters: [{$ref: '#/components/parameters/VerificationId'}]
      responses:
        '200': {description: Every evaluated candidate, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Candidate'}}}}}
  /api/v1/verifications/{verification_id}/findings:
    get:
      operationId: getVerificationFindings
      parameters: [{$ref: '#/components/parameters/VerificationId'}]
      responses:
        '200': {description: Deterministic R001-R014 findings, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Finding'}}}}}
  /api/v1/verifications/{verification_id}/re-evaluate:
    post:
      operationId: reEvaluateVerification
      parameters:
        - {$ref: '#/components/parameters/VerificationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: false, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: New immutable run queued, content: {application/json: {schema: {$ref: '#/components/schemas/QueuedVerification'}}}}
  /internal/v1/verifications/{run_id}/review-package:
    get:
      operationId: getVerificationReviewPackageInternal
      parameters:
        - {name: run_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Minimized immutable reviewer package, content: {application/json: {schema: {type: object}}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    VerificationId: {name: verification_id, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  schemas:
    VerificationRequest:
      type: object
      required: [claim_source, claim_id, claim_revision, patient, facility, service_period, items]
      properties:
        claim_source: {type: string, maxLength: 64}
        claim_id: {type: string, maxLength: 128}
        claim_revision: {type: string, maxLength: 64}
        relationship:
          type: object
          properties: {type: {type: string, enum: [ORIGINAL, CORRECTION, REVERSAL]}, related_claim_id: {type: [string, 'null']}}
        patient:
          type: object
          anyOf: [{required: [participant_number]}, {required: [full_name]}]
          properties: {participant_number: {type: [string, 'null']}, full_name: {type: [string, 'null']}}
        facility:
          type: object
          required: [namespace, code]
          properties: {namespace: {type: string}, code: {type: string}}
        service_period:
          type: object
          required: [start, end]
          properties: {start: {type: string, format: date-time}, end: {type: string, format: date-time}}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [item_ref, item_type, code_system, code]
            properties: {item_ref: {type: string}, item_type: {type: string, enum: [DIAGNOSIS, PROCEDURE, MEDICATION, MEDICATION_DISPENSE]}, code_system: {type: string}, code: {type: string}, quantity: {type: number, exclusiveMinimum: 0}, unit: {type: string}}
    QueuedVerification:
      type: object
      required: [verification_id, run_id, status]
      properties: {verification_id: {type: string, format: uuid}, run_id: {type: string, format: uuid}, status: {type: string}}
    Assessment:
      type: object
      required: [verification_id, run_id, status, encounter_match_status, identity_assurance, evidence_reconciliation_status, duplicate_assessment_status, patient_confirmation_status, review_required, final_fraud_decision, data_freshness, ruleset_version, mapping_version]
      properties:
        verification_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        status: {type: string}
        encounter_match_status: {type: string}
        identity_assurance: {type: string}
        evidence_reconciliation_status: {type: string}
        duplicate_assessment_status: {type: string}
        patient_confirmation_status: {type: string}
        review_required: {type: boolean}
        final_fraud_decision: {type: 'null'}
        data_freshness: {type: string}
        ruleset_version: {type: string}
        mapping_version: {type: string}
    Candidate:
      type: object
      required: [encounter_id, evidence_snapshot_id, encounter_revision, evidence_revision, identity_assurance, presence_status, patient_confirmation_status, match_state, reasons]
      properties: {encounter_id: {type: string, format: uuid}, evidence_snapshot_id: {type: string, format: uuid}, encounter_revision: {type: integer}, evidence_revision: {type: integer}, identity_assurance: {type: string}, presence_status: {type: string}, patient_confirmation_status: {type: string}, match_state: {type: string}, reasons: {type: array, items: {type: string}}}
    Finding:
      type: object
      required: [rule_id, rule_version, severity, finding_code, evidence_refs, explanation_facts, limitations]
      properties: {rule_id: {type: string}, rule_version: {type: string}, severity: {type: string}, finding_code: {type: string}, evidence_refs: {type: array, items: {type: string}}, explanation_facts: {type: object}, limitations: {type: string}}
