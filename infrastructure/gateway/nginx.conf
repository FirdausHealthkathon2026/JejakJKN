# Public API routing only. /internal/v1 remains unreachable from the host gateway.
events {}
http {
  proxy_set_header Host $host;
  proxy_set_header X-Request-Id $request_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  server {
    listen 8080;
    client_max_body_size 1m;

    location /internal/ { return 403; }
    location = /health { return 200 '{"status":"ok","service":"api-gateway"}'; add_header Content-Type application/json; }

    location ~ ^/api/v1/patient/encounters/[^/]+/checkout-summary$ { proxy_pass http://evidence-api:8002; }
    location ~ ^/api/v1/integrations/encounters/[^/]+/exceptions$ { proxy_pass http://encounter-api:8001; }
    location /api/v1/patient/qr-tokens { proxy_pass http://encounter-api:8001; }
    location /api/v1/patient/encounters { proxy_pass http://encounter-api:8001; }
    location /api/v1/patient/checkout-summaries { proxy_pass http://evidence-api:8002; }
    location /api/v1/integrations/qr/ { proxy_pass http://encounter-api:8001; }
    location /api/v1/integrations/encounters/ { proxy_pass http://evidence-api:8002; }
    location /api/v1/verifications { proxy_pass http://verification-api:8003; }
    location /api/v1/review-cases { proxy_pass http://review-api:8004; }
  }
}
