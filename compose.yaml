name: jejakjkn

services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - ./infrastructure/postgres/init-isolated-dbs.sql:/docker-entrypoint-initdb.d/01-init-isolated-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    volumes:
      - ./infrastructure/keycloak/realm-jejakjkn-dev.json:/opt/keycloak/data/import/realm-jejakjkn-dev.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  encounter-api:
    build:
      context: .
      dockerfile: services/encounter-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  encounter-outbox-worker:
    build:
      context: .
      dockerfile: services/encounter-service/Dockerfile
    command: ["python", "-m", "app.infrastructure.outbox_worker"]
    depends_on:
      encounter-api:
        condition: service_started
    networks:
      - internal

  evidence-api:
    build:
      context: .
      dockerfile: services/evidence-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  evidence-outbox-worker:
    build:
      context: .
      dockerfile: services/evidence-service/Dockerfile
    command: ["python", "-m", "app.infrastructure.outbox_worker"]
    depends_on:
      evidence-api:
        condition: service_started
    networks:
      - internal

  verification-api:
    build:
      context: .
      dockerfile: services/verification-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  verification-worker:
    build:
      context: .
      dockerfile: services/verification-service/Dockerfile
    command: ["python", "-m", "app.application.verification_worker"]
    depends_on:
      verification-api:
        condition: service_started
    networks:
      - internal

  verification-outbox-worker:
    build:
      context: .
      dockerfile: services/verification-service/Dockerfile
    command: ["python", "-m", "app.infrastructure.outbox_worker"]
    depends_on:
      verification-api:
        condition: service_started
    networks:
      - internal

  review-api:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  review-outbox-worker:
    build:
      context: .
      dockerfile: services/review-service/Dockerfile
    command: ["python", "-m", "app.infrastructure.outbox_worker"]
    depends_on:
      review-api:
        condition: service_started
    networks:
      - internal

  narrative-worker:
    profiles: ["narrative"]
    build:
      context: .
      dockerfile: services/narrative-worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      review-api:
        condition: service_started
    networks:
      - internal

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - encounter-api
      - evidence-api
      - verification-api
      - review-api
    networks:
      - internal

  simrs-a-api:
    build:
      context: .
      dockerfile: simulators/simrs-a-backend/Dockerfile
    ports:
      - "8101:8101"
    depends_on:
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_started
    networks:
      - internal

  simrs-b-api:
    profiles: ["simrs-b"]
    build:
      context: .
      dockerfile: simulators/simrs-b-backend/Dockerfile
    ports:
      - "8102:8102"
    depends_on:
      postgres:
        condition: service_healthy
      api-gateway:
        condition: service_started
    networks:
      - internal

  patient-web:
    build:
      context: apps/patient-web
    ports:
      - "5173:5173"
    networks:
      - internal

  simrs-a-web:
    build:
      context: apps/simrs-a-web
    ports:
      - "5174:5174"
    networks:
      - internal

  verifier-web:
    build:
      context: apps/verifier-web
    ports:
      - "5175:5175"
    networks:
      - internal

  simrs-b-demo:
    profiles: ["simrs-b"]
    build:
      context: apps/simrs-b-demo
    ports:
      - "5176:5176"
    networks:
      - internal

networks:
  internal:
    driver: bridge
